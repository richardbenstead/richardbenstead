# Tests the websites dashboard (websites-dashboard/) on every change to it, and publishes it to Cloudflare from main.
#
# Publishing needs two repository secrets (Settings > Secrets and variables > Actions): CLOUDFLARE_API_TOKEN, made from
# the "Edit Cloudflare Workers" template, and CLOUDFLARE_ACCOUNT_ID. Until they are set, the publish step is skipped
# with a notice. The dashboard's own secrets (sign-in and data tokens) live in the Worker: see its README.
name: Websites dashboard

on:
  push:
    paths: ['websites-dashboard/**', '.github/workflows/websites-dashboard.yml']
  pull_request:
    paths: ['websites-dashboard/**', '.github/workflows/websites-dashboard.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: websites-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One publish at a time; a newer one waits rather than cutting the running one off.
    concurrency: websites-dashboard-publish
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: websites-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4.151.3 deploy
      - name: Say why nothing was published
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set in this repository's secrets, so the dashboard was not published."
